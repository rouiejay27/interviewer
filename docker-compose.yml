services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewer-postgres
    environment:
      POSTGRES_USER: interviewer
      POSTGRES_PASSWORD: interviewer
      POSTGRES_DB: interviewer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - interviewer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewer -d interviewer"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  interviewer-pgdata:
